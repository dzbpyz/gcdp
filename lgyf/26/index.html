<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>永锋电子商务平台</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            overflow: hidden;
            overscroll-behavior-y: contain;
        }

        body.is-dragging {
            user-select: none;
            cursor: grabbing;
        }

        .controls-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 48px;
            padding: 0 15px;
            background-color: #fff;
            border-bottom: 1px solid #f0f0f0;
            z-index: 100;
        }

        .controls-group,
        .page-info,
        .zoom-button-group {
            display: flex;
            align-items: center;
        }

        .controls-group {
            gap: 16px;
        }

        .page-nav-btn {
            font-size: 20px;
            font-weight: bold;
            padding: 0 10px;
            cursor: pointer;
            user-select: none;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f9f9f9;
            height: 28px;
            line-height: 26px;
        }

        #page-input {
            width: 40px;
            height: 28px;
            border: 1px solid #c9c9c9;
            border-radius: 4px;
            text-align: center;
            font-size: 16px;
            padding: 0 4px;
            margin: 0 8px;
        }

        .page-total {
            font-size: 18px;
            color: #333;
        }

        .divider {
            width: 1px;
            height: 16px;
            background-color: #d9d9d9;
        }

        .zoom-button-group button {
            background-color: transparent;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 16px;
            color: #333;
            cursor: pointer;
        }

        .content-area {
            padding-top: 48px;
            height: 100vh;
            overflow: auto;
            text-align: center;
            padding-left: 10px;
            padding-right: 10px;
            cursor: grab;
            touch-action: none;
        }

        #pdf-canvas {
            display: block;
            margin: 10px auto 20px;
        }
    </style>
</head>
<body>

<div class="controls-bar">
    <div class="controls-group">
        <div class="page-info">
            <div class="page-nav-btn" id="prev-page">&lt;</div>
            <input type="number" id="page-input" value="1">
            <span class="page-total">/ 1</span>
            <div class="page-nav-btn" id="next-page">&gt;</div>
        </div>

        <div class="divider"></div>

        <div class="zoom-button-group">
            <button id="zoom-out-btn">缩小</button>
            <button id="zoom-in-btn">放大</button>
        </div>
    </div>
</div>

<main class="content-area">
    <canvas id="pdf-canvas"></canvas>
</main>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';

    document.addEventListener('DOMContentLoaded', function () {

        const zoomInBtn = document.getElementById('zoom-in-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');
        const pageInput = document.getElementById('page-input');
        const pageTotalSpan = document.querySelector('.page-total');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const canvas = document.getElementById('pdf-canvas');
        const contentArea = document.querySelector('.content-area');

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;

        let currentScale = 1.0;
        const PIXEL_RATIO = window.devicePixelRatio || 1;

        let isDragging = false;
        let startDrag = { x: 0, y: 0 };
        let startScroll = { left: 0, top: 0 };

        let initialPinchDistance = 0;
        let initialScale = 1.0;

        function getPdfNameFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const pdfName = params.get('pdf');
            return pdfName ? `${pdfName}.pdf` : 'default.pdf';
        }

        function getDistance(t1, t2) {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function renderPage(num) {
            pageRendering = true;

            pdfDoc.getPage(num).then(function (page) {
                const viewportOriginal = page.getViewport({ scale: 1 });

                const containerWidth = contentArea.clientWidth;

                const fitScale = containerWidth / viewportOriginal.width;

                const finalScale = fitScale * currentScale;

                const displayViewport = page.getViewport({
                    scale: finalScale
                });

                const renderViewport = page.getViewport({
                    scale: finalScale * PIXEL_RATIO
                });

                canvas.width = renderViewport.width;
                canvas.height = renderViewport.height;

                canvas.style.width = displayViewport.width + 'px';
                canvas.style.height = displayViewport.height + 'px';

                const ctx = canvas.getContext('2d');

                page.render({
                    canvasContext: ctx,
                    viewport: renderViewport
                }).promise.then(() => {
                    pageRendering = false;

                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            pageInput.value = num;
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function updateCanvasScale() {
            queueRenderPage(pageNum);
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        function handleTouchStart(event) {
            if (event.touches.length === 2) {
                event.preventDefault();

                isDragging = false;

                initialPinchDistance = getDistance(
                    event.touches[0],
                    event.touches[1]
                );

                initialScale = currentScale;
            }
            else if (event.touches.length === 1) {
                isDragging = true;

                startDrag.x = event.touches[0].clientX;
                startDrag.y = event.touches[0].clientY;

                startScroll.left = contentArea.scrollLeft;
                startScroll.top = contentArea.scrollTop;

                document.body.classList.add('is-dragging');
            }
        }

        function handleTouchMove(event) {
            if (event.touches.length === 2 && initialPinchDistance > 0) {
                event.preventDefault();

                const scaleFactor =
                    getDistance(event.touches[0], event.touches[1]) /
                    initialPinchDistance;

                currentScale = Math.max(
                    0.5,
                    Math.min(3, initialScale * scaleFactor)
                );

                updateCanvasScale();
            }
            else if (event.touches.length === 1 && isDragging) {
                event.preventDefault();

                const dx = event.touches[0].clientX - startDrag.x;
                const dy = event.touches[0].clientY - startDrag.y;

                contentArea.scrollLeft = startScroll.left - dx;
                contentArea.scrollTop = startScroll.top - dy;
            }
        }

        function handleTouchEnd() {
            initialPinchDistance = 0;
            isDragging = false;
            document.body.classList.remove('is-dragging');
        }

        zoomInBtn.addEventListener('click', () => {
            currentScale = Math.min(3, currentScale + 0.2);
            updateCanvasScale();
        });

        zoomOutBtn.addEventListener('click', () => {
            currentScale = Math.max(0.5, currentScale - 0.2);
            updateCanvasScale();
        });

        prevPageBtn.addEventListener('click', onPrevPage);
        nextPageBtn.addEventListener('click', onNextPage);

        pageInput.addEventListener('change', (e) => {
            const page = parseInt(e.target.value);

            if (page > 0 && page <= pdfDoc.numPages) {
                pageNum = page;
                queueRenderPage(pageNum);
            } else {
                e.target.value = pageNum;
            }
        });

        window.addEventListener('resize', () => {
            if (pdfDoc) queueRenderPage(pageNum);
        });

        contentArea.addEventListener('touchstart', handleTouchStart, {
            passive: false
        });

        contentArea.addEventListener('touchmove', handleTouchMove, {
            passive: false
        });

        contentArea.addEventListener('touchend', handleTouchEnd);

        const pdfUrl = getPdfNameFromUrl();

        pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
            pdfDoc = pdf;
            pageTotalSpan.textContent = `/ ${pdfDoc.numPages}`;
            renderPage(pageNum);
        }).catch(err => {
            console.error(err);
            alert(`无法加载PDF文件: ${pdfUrl}`);
        });

    });
</script>

</body>
</html>
