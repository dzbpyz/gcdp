<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键的meta标签，用于移动设备适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>永锋电子商务平台</title>
    <style>
        /* CSS Reset and Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f2f5; /* 页面背景色 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            -webkit-font-smoothing: antialiased; /* 字体抗锯齿，更清晰 */
        }
        
        /* --- 1. 顶部主导航栏 --- */
        .main-header {
            position: fixed; /* 固定在屏幕顶部 */
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px; /* 固定高度 */
            padding: 0 15px;
            background-color: #fff;
            z-index: 100; /* 确保在最上层 */
        }
        .header-icon {
            width: 24px;
            height: 24px;
        }
        .header-center {
            text-align: center;
        }
        .header-center h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1d2129;
        }
        .header-center p {
            font-size: 12px;
            color: #86909c;
        }

        /* --- 2. 二级控制栏 --- */
        .controls-bar {
            position: fixed; /* 固定在主导航栏下方 */
            top: 60px; /* 主导航栏的高度 */
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px; /* 固定高度 */
            padding: 0 15px;
            background-color: #fff;
            border-bottom: 1px solid #f0f0f0; /* 截图中的细线 */
            z-index: 99;
        }

        .page-info, .zoom-button-group {
            display: flex;
            align-items: center;
        }
        
        #page-input {
            width: 40px;
            height: 28px;
            border: 1px solid #c9c9c9;
            border-radius: 4px;
            text-align: right;
            font-size: 16px;
            padding: 0 8px;
        }
        
        .page-total {
            font-size: 18px;
            color: #333;
            margin-left: 8px;
        }

        .divider {
            width: 1px;
            height: 16px;
            background-color: #d9d9d9;
        }

        .zoom-button-group button {
            background-color: transparent;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 16px;
            color: #333;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
            user-select: none;
        }
        
        .zoom-button-group button.is-active {
            background-color: #e9e9e9;
        }
        
        /* --- 3. 主要内容区域 --- */
        .content-area {
            /* 关键：为内容区域设置上边距，防止被两个固定导航栏遮挡 */
            /* 60px (主导航) + 48px (控制栏) = 108px */
            padding-top: 108px;
            padding-bottom: 20px;
        }

        #main-image {
            display: block;
            width: 100%;
            height: auto;
            transform-origin: center;
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- 顶部主导航栏 -->
    <header class="main-header">
        <div class="header-icon">
            <!-- Close Icon (X) -->
            <svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M764.288 214.592L512 466.88 259.712 214.592a31.936 31.936 0 00-45.12 45.12L466.88 512 214.592 764.288a31.936 31.936 0 1045.12 45.12L512 557.12l252.288 252.288a31.936 31.936 0 0045.12-45.12L557.12 512l252.288-252.288a31.936 31.936 0 00-45.12-45.12z"></path></svg>
        </div>
        <div class="header-center">
            <h1>永锋电子商务平台</h1>
            <p>pcweb.yfsteel.net.cn</p>
        </div>
        <div class="header-icon">
            <!-- More Icon (...) -->
            <svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M176 511a56 56 0 10112 0 56 56 0 10-112 0zm280 0a56 56 0 10112 0 56 56 0 10-112 0zm280 0a56 56 0 10112 0 56 56 0 10-112 0z"></path></svg>
        </div>
    </header>

    <!-- 二级控制栏 -->
    <div class="controls-bar">
        <div class="page-info">
            <input type="text" id="page-input" value="1" readonly>
            <span class="page-total">/ 1</span>
        </div>
        <div class="zoom-button-group">
            <button id="zoom-out-btn">缩小</button>
            <div class="divider"></div>
            <button id="zoom-in-btn">放大</button>
        </div>
    </div>

    <!-- 主要内容区域 -->
    <main class="content-area">
        <img id="main-image" src="../img/003.png" alt="产品质量证明书">
    </main>
    
    <!-- JavaScript 逻辑保持不变 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const zoomInBtn = document.getElementById('zoom-in-btn');
            const zoomOutBtn = document.getElementById('zoom-out-btn');
            const image = document.getElementById('main-image');

            let currentScale = 1.0;
            const scaleStep = 0.2;
            const minScale = 0.4;

            function updateScale() {
                image.style.transform = `scale(${currentScale})`;
            }

            zoomInBtn.addEventListener('click', function() {
                zoomOutBtn.classList.remove('is-active');
                zoomInBtn.classList.add('is-active');
                
                currentScale += scaleStep;
                updateScale();
            });

            zoomOutBtn.addEventListener('click', function() {
                zoomInBtn.classList.remove('is-active');
                zoomOutBtn.classList.add('is-active');
                
                if (currentScale > minScale) {
                    currentScale -= scaleStep;
                    updateScale();
                }
            });
        });
    </script>

</body>
</html>
