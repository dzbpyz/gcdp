<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>永锋电子商务平台</title>
    <style>
        /* CSS Reset and Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        /* --- 1. 顶部主导航栏 (无变化) --- */
        .main-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            padding: 0 15px;
            background-color: #fff;
            z-index: 100;
        }
        .header-icon {
            width: 24px;
            height: 24px;
        }
        .header-center {
            text-align: center;
        }
        .header-center h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1d2129;
        }
        .header-center p {
            font-size: 12px;
            color: #86909c;
        }

        /* --- 2. 二级控制栏 (样式核心改动) --- */
        .controls-bar {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            display: flex;
            /* 关键改动：从 space-between 改为 center，实现整体居中 */
            justify-content: center; 
            align-items: center;
            height: 48px;
            padding: 0 15px;
            background-color: #fff;
            border-bottom: 1px solid #f0f0f0;
            z-index: 99;
        }
        
        /* 新增一个容器来包裹所有控件，方便设置它们之间的间距 */
        .controls-group {
            display: flex;
            align-items: center;
            /* 使用 gap 在“页码区”和“缩放区”之间创建间距 */
            gap: 24px; 
        }

        .page-info, .zoom-button-group {
            display: flex;
            align-items: center;
        }
        
        #page-input {
            width: 40px;
            height: 28px;
            border: 1px solid #c9c9c9;
            border-radius: 4px;
            text-align: right;
            font-size: 16px;
            padding: 0 8px;
        }
        
        .page-total {
            font-size: 18px;
            color: #333;
            margin-left: 8px;
        }

        .divider {
            width: 1px;
            height: 16px;
            background-color: #d9d9d9;
        }

        .zoom-button-group button {
            background-color: transparent;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 16px;
            color: #333;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
            user-select: none;
        }
        
        .zoom-button-group button.is-active {
            background-color: #e9e9e9;
        }
        
        /* --- 3. 主要内容区域 (无变化) --- */
        .content-area {
            padding-top: 108px;
            padding-bottom: 20px;
        }

        #main-image {
            display: block;
            width: 100%;
            height: auto;
            transform-origin: center;
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- 顶部主导航栏 (无变化) -->
   

    <!-- HTML 结构调整: 将所有控件包裹在一个居中容器内 -->
    <div class="controls-bar">
        <div class="controls-group">
            <div class="page-info">
                <input type="text" id="page-input" value="1" readonly>
                <span class="page-total">/ 1</span>
            </div>
            <div class="zoom-button-group">
                <button id="zoom-out-btn">缩小</button>
                <div class="divider"></div>
                <button id="zoom-in-btn">放大</button>
            </div>
        </div>
    </div>

    <!-- 主要内容区域 (无变化) -->
    <main class="content-area">
        <img id="main-image" src="../img/003.png" alt="产品质量证明书">
    </main>
    
    <!-- JavaScript 逻辑保持不变 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const zoomInBtn = document.getElementById('zoom-in-btn');
            const zoomOutBtn = document.getElementById('zoom-out-btn');
            const image = document.getElementById('main-image');

            let currentScale = 1.0;
            const scaleStep = 0.2;
            const minScale = 0.4;

            function updateScale() {
                image.style.transform = `scale(${currentScale})`;
            }

            zoomInBtn.addEventListener('click', function() {
                zoomOutBtn.classList.remove('is-active');
                zoomInBtn.classList.add('is-active');
                
                currentScale += scaleStep;
                updateScale();
            });

            zoomOutBtn.addEventListener('click', function() {
                zoomInBtn.classList.remove('is-active');
                zoomOutBtn.classList.add('is-active');
                
                if (currentScale > minScale) {
                    currentScale -= scaleStep;
                    updateScale();
                }
            });
        });
    </script>

</body>
</html>
